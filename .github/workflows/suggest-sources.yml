name: Suggest Source URLs

# Finds real scholarship pages for universities whose source is a Google search link or a dead URL.
# Results land in the Supabase table `source_url_suggestions` as 'pending'; nothing is crawled
# until you set a row's status to 'approved' in the Supabase Table Editor.

on:
  schedule:
    - cron: "15 3 * * 0" # Sundays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print suggestions instead of saving them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: pip install -r automation/requirements.txt
      - name: Propose source URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: cd automation && python suggest_sources.py
