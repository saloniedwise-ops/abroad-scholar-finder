# Auto-deploy the site to GitHub Pages on every merge to main.
# Merging a PR = approving it; this makes the change live with nothing else to do.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test --if-present
      # Project site lives under /<repo>/; Lovable builds at root, so the base
      # path is passed only here and Lovable's own build is unaffected.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      # SPA fallback so deep links like /scholarship/xyz work on Pages.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
